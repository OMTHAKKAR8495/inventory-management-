services:
  provisionsmart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provisionsmart-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=wholesale-provision-store-super-secure-key-2026-xyz-9988
      # Optional: To connect with cloud Supabase/Postgres, provide DATABASE_URL here:
      # - DATABASE_URL=postgresql://postgres.yourref:yourpass@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
    volumes:
      # Persistent volume mount for local SQLite DB and snapshot backups
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
